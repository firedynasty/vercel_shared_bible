<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Bible</title>
<style>
  :root { --bg:#faf8f4; --fg:#222; --muted:#777; --line:#ddd; --accent:#8a5a2b; --pane:#fff; }
  :root { --fs: 17px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --pane:#1d1f23; }
  }
  :root[data-theme="dark"] { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --pane:#1d1f23; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: system-ui, sans-serif; font-size: 14px; }
  header .sp { flex: 1; }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--pane); color: var(--fg); }
  button { cursor: pointer; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { font-size: var(--fs); overflow-y: auto; padding: 16px 20px 60px; background: var(--pane); }
  .wrap { position: relative; display: flex; min-height: 0; min-width: 0; }
  .wrap + .wrap { border-left: 1px solid var(--line); }
  .pane { flex: 1; min-width: 0; }
  .pgdn { position: absolute; right: 24px; bottom: 12px; width: 40px; height: 40px; padding: 0; border-radius: 50%; opacity: .85; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .pane h2 { margin: 0 0 12px; font: 600 15px system-ui, sans-serif; color: var(--accent); }
  .para { margin: 0 0 14px; }
  h3.heading { margin: 22px 0 8px; font: 700 1em system-ui, sans-serif; }
  .sub { font-style: italic; color: var(--muted); margin: 0 0 8px; }
  .poem { display: block; }
  .poem.p1 { padding-left: 1.2em; text-indent: -0.0em; }
  .poem.p2 { padding-left: 2.4em; }
  .poem.p3 { padding-left: 3.6em; }
  .v sup { color: var(--accent); font: 600 12px system-ui, sans-serif; margin-right: 4px; }
  .v.hl { background: rgba(217,160,102,.25); border-radius: 4px; }
  .v.has sup, .v.cov sup { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; cursor: pointer; }
  .v.cov sup { text-decoration-style: dotted; }
  .c.flash { background: rgba(217,160,102,.25); border-radius: 4px; }
  .c { margin: 0 0 16px; white-space: pre-wrap; }
  .c .ref { display: block; color: var(--accent); font: 600 13px system-ui, sans-serif; margin-bottom: 2px; }
  .msg { color: var(--muted); font-family: system-ui, sans-serif; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .wrap + .wrap { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <select id="book" aria-label="Book"></select>
  <select id="chapter" aria-label="Chapter"></select>
  <button id="prev" aria-label="Previous chapter">&larr;</button>
  <button id="next" aria-label="Next chapter">&rarr;</button>
  <span class="sp"></span>
  <button id="fontDown" aria-label="Smaller text" title="Smaller text">A&minus;</button>
  <button id="fontUp" aria-label="Larger text" title="Larger text">A+</button>
  <button id="theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>
  <span class="msg">Pane 1: BSB</span>
  <label>Pane 2 <select id="source"></select></label>
</header>
<main>
  <div class="wrap">
    <section class="pane" id="pane1"></section>
    <button class="pgdn" data-pane="pane1" aria-label="Page down in pane 1" title="Page down">&#9660;</button>
  </div>
  <div class="wrap">
    <section class="pane" id="pane2"></section>
    <button class="pgdn" data-pane="pane2" aria-label="Page down in pane 2" title="Page down">&#9660;</button>
  </div>
</main>

<script>
// [abbrev, name, HelloAO book id]
const BOOKS = [
  ['gn','Genesis','GEN'],['ex','Exodus','EXO'],['lv','Leviticus','LEV'],['nm','Numbers','NUM'],['dt','Deuteronomy','DEU'],
  ['js','Joshua','JOS'],['jud','Judges','JDG'],['rt','Ruth','RUT'],['1sm','1 Samuel','1SA'],['2sm','2 Samuel','2SA'],
  ['1kgs','1 Kings','1KI'],['2kgs','2 Kings','2KI'],['1ch','1 Chronicles','1CH'],['2ch','2 Chronicles','2CH'],['ezr','Ezra','EZR'],
  ['ne','Nehemiah','NEH'],['et','Esther','EST'],['job','Job','JOB'],['ps','Psalms','PSA'],['prv','Proverbs','PRO'],
  ['ec','Ecclesiastes','ECC'],['so','Song of Solomon','SNG'],['is','Isaiah','ISA'],['jr','Jeremiah','JER'],['lm','Lamentations','LAM'],
  ['ez','Ezekiel','EZK'],['dn','Daniel','DAN'],['ho','Hosea','HOS'],['jl','Joel','JOL'],['am','Amos','AMO'],
  ['ob','Obadiah','OBA'],['jn','Jonah','JON'],['mi','Micah','MIC'],['na','Nahum','NAM'],['hk','Habakkuk','HAB'],
  ['zp','Zephaniah','ZEP'],['hg','Haggai','HAG'],['zc','Zechariah','ZEC'],['ml','Malachi','MAL'],
  ['mt','Matthew','MAT'],['mk','Mark','MRK'],['lk','Luke','LUK'],['jo','John','JHN'],['act','Acts','ACT'],
  ['rm','Romans','ROM'],['1co','1 Corinthians','1CO'],['2co','2 Corinthians','2CO'],['gl','Galatians','GAL'],['eph','Ephesians','EPH'],
  ['ph','Philippians','PHP'],['cl','Colossians','COL'],['1ts','1 Thessalonians','1TH'],['2ts','2 Thessalonians','2TH'],
  ['1tm','1 Timothy','1TI'],['2tm','2 Timothy','2TI'],['tt','Titus','TIT'],['phm','Philemon','PHM'],['hb','Hebrews','HEB'],
  ['jm','James','JAS'],['1pe','1 Peter','1PE'],['2pe','2 Peter','2PE'],['1jo','1 John','1JN'],['2jo','2 John','2JN'],
  ['3jo','3 John','3JN'],['jd','Jude','JUD'],['re','Revelation','REV'],
];
const OT_COUNT = 39;
const SOURCES = { 'john-gill': 'John Gill', 'matthew-henry': 'Matthew Henry' };
const COMMENTARY_API = 'https://bible.helloao.org/api/c';
const BIBLE_API = 'https://bible.helloao.org/api/BSB';
// chapters per book, same order as BOOKS
const CHAPTERS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,
  28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];

const $ = (id) => document.getElementById(id);
const els = { book: $('book'), chapter: $('chapter'), source: $('source'), pane1: $('pane1'), pane2: $('pane2') };

const state = { book: 0, chapter: 1, source: 'john-gill', sourceIsManual: false };
const bibleCache = {};      // "BOOK/chapter" -> parsed json
const commentaryCache = {}; // "source/BOOK/chapter" -> parsed json
let renderToken = 0;

const defaultSource = (bookIdx) => (bookIdx < OT_COUNT ? 'john-gill' : 'matthew-henry');

function setMsg(pane, text) {
  pane.replaceChildren();
  const p = document.createElement('p');
  p.className = 'msg';
  p.textContent = text;
  pane.appendChild(p);
}

async function loadBible(bookIdx, chapter) {
  const key = `${BOOKS[bookIdx][2]}/${chapter}`;
  if (!bibleCache[key]) {
    const res = await fetch(`${BIBLE_API}/${key}.json`);
    if (!res.ok) throw new Error(`Could not load BSB ${BOOKS[bookIdx][1]} ${chapter} (${res.status})`);
    bibleCache[key] = await res.json();
  }
  return bibleCache[key];
}

async function loadCommentary(source, bookIdx, chapter) {
  const key = `${source}/${BOOKS[bookIdx][2]}/${chapter}`;
  if (!commentaryCache[key]) {
    const res = await fetch(`${COMMENTARY_API}/${source}/${BOOKS[bookIdx][2]}/${chapter}.json`);
    if (!res.ok) throw new Error(`${SOURCES[source]} has no entry for this chapter (${res.status})`);
    commentaryCache[key] = await res.json();
  }
  return commentaryCache[key];
}

// HelloAO verse content is a list of strings; join and ignore any non-string parts.
const flatten = (parts) => (parts || []).filter((x) => typeof x === 'string').join(' ').trim();

// BSB chapter content is a sequence of headings, verses and line breaks (paragraph ends).
// A verse's parts are plain strings, poetry lines ({text, poem}), footnote ids (skipped) and inline breaks.
function renderBible(json) {
  els.pane1.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = `${BOOKS[state.book][1]} ${state.chapter} (BSB)`;
  els.pane1.appendChild(h);

  let para = null;
  const paragraph = () => {
    if (!para) { para = document.createElement('p'); para.className = 'para'; els.pane1.appendChild(para); }
    return para;
  };

  (json.chapter.content || []).forEach((item) => {
    if (item.type === 'heading') {
      para = null;
      const el = document.createElement('h3');
      el.className = 'heading';
      el.textContent = flatten(item.content);
      els.pane1.appendChild(el);
    } else if (item.type === 'hebrew_subtitle') {
      para = null;
      const el = document.createElement('p');
      el.className = 'sub';
      el.textContent = flatten(item.content);
      els.pane1.appendChild(el);
    } else if (item.type === 'line_break') {
      para = null;
    } else if (item.type === 'verse') {
      const verse = document.createElement('span');
      verse.className = 'v';
      verse.dataset.v = item.number;
      let numberPlaced = false;
      const placeNumber = (host) => {
        if (numberPlaced) return;
        const n = document.createElement('sup');
        n.textContent = item.number;
        host.appendChild(n);
        numberPlaced = true;
      };
      (item.content || []).forEach((part) => {
        if (typeof part === 'string') {
          placeNumber(verse);
          verse.append(part + ' ');
        } else if (part && typeof part.text === 'string') {
          const line = document.createElement('span');
          line.className = `poem p${Math.min(part.poem || 1, 3)}`;
          placeNumber(line);
          line.append(part.text);
          verse.appendChild(line);
        } else if (part && part.lineBreak) {
          // a poetry line is already a block, so a break after it would add a blank line
          if (!verse.lastElementChild?.classList.contains('poem')) verse.appendChild(document.createElement('br'));
        }
      });
      placeNumber(verse);
      paragraph().append(verse, ' ');
    }
  });
  els.pane1.scrollTop = 0;
}

function renderCommentary(json) {
  els.pane2.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = `${BOOKS[state.book][1]} ${state.chapter} (${SOURCES[state.source]})`;
  els.pane2.appendChild(h);
  const chapter = json.chapter || {};
  const intro = typeof chapter.introduction === 'string' ? chapter.introduction : flatten(chapter.introduction);
  if (intro) {
    const p = document.createElement('p');
    p.className = 'c';
    p.textContent = intro;
    els.pane2.appendChild(p);
  }
  const items = (chapter.content || []).filter((x) => x.type === 'verse');
  if (!items.length && !intro) {
    setMsg(els.pane2, `${SOURCES[state.source]} has no commentary for ${BOOKS[state.book][1]} ${state.chapter}.`);
    return;
  }
  items.forEach((item) => {
    const text = flatten(item.content);
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'c';
    div.dataset.v = item.number;
    const ref = document.createElement('span');
    ref.className = 'ref';
    ref.textContent = `v. ${item.number}`;
    div.append(ref, text);
    // clicking a commentary entry highlights its verse in pane 1
    div.addEventListener('click', () => highlight(item.number));
    els.pane2.appendChild(div);
  });
  els.pane2.scrollTop = 0;
  markVerses(items.map((item) => item.number));
}

// Underline the verse numbers in pane 1 that have commentary: solid = own entry, dotted = covered by an earlier section.
function markVerses(starts) {
  const sorted = [...new Set(starts)].sort((a, b) => a - b);
  els.pane1.querySelectorAll('.v').forEach((el) => {
    const v = +el.dataset.v;
    let owner = null;
    for (const n of sorted) { if (n <= v) owner = n; else break; }
    if (owner === null) return;
    el.dataset.c = owner;
    el.classList.add(owner === v ? 'has' : 'cov');
  });
}

function jumpToCommentary(verse) {
  const target = els.pane2.querySelector(`.c[data-v="${verse}"]`);
  if (!target) return;
  const top = target.getBoundingClientRect().top - els.pane2.getBoundingClientRect().top + els.pane2.scrollTop - 8;
  els.pane2.scrollTo({ top, behavior: 'smooth' });
  els.pane2.querySelectorAll('.c.flash').forEach((el) => el.classList.remove('flash'));
  target.classList.add('flash');
  setTimeout(() => target.classList.remove('flash'), 1500);
}

function highlight(verse) {
  els.pane1.querySelectorAll('.v.hl').forEach((el) => el.classList.remove('hl'));
  const el = els.pane1.querySelector(`.v[data-v="${verse}"]`);
  if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

async function render() {
  const token = ++renderToken;
  syncControls();
  setMsg(els.pane1, 'Loading…');
  setMsg(els.pane2, 'Loading…');
  try {
    const data = await loadBible(state.book, state.chapter);
    if (token !== renderToken) return;
    renderBible(data);
  } catch (err) {
    if (token === renderToken) setMsg(els.pane1, err.message);
  }
  try {
    const json = await loadCommentary(state.source, state.book, state.chapter);
    if (token !== renderToken) return;
    renderCommentary(json);
  } catch (err) {
    if (token === renderToken) setMsg(els.pane2, err.message);
  }
  try { localStorage.setItem('sharedBible', JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

function syncControls() {
  els.book.value = state.book;
  els.source.value = state.source;
  const count = CHAPTERS[state.book];
  if (els.chapter.options.length !== count) {
    els.chapter.replaceChildren(...Array.from({ length: count }, (_, i) => new Option(i + 1, i + 1)));
  }
  els.chapter.value = state.chapter;
}

function go(bookIdx, chapter) {
  const crossedTestament = (bookIdx < OT_COUNT) !== (state.book < OT_COUNT);
  state.book = bookIdx;
  state.chapter = chapter;
  // a manual source choice sticks until we cross into the other testament
  if (!state.sourceIsManual || crossedTestament) {
    state.source = defaultSource(bookIdx);
    state.sourceIsManual = false;
  }
  render();
}

function step(delta) {
  let b = state.book, c = state.chapter + delta;
  if (c < 1) {
    if (b === 0) return;
    b -= 1; c = CHAPTERS[b];
  } else if (c > CHAPTERS[b]) {
    if (b === BOOKS.length - 1) return;
    b += 1; c = 1;
  }
  go(b, c);
}

function init() {
  els.book.replaceChildren(...BOOKS.map((b, i) => new Option(b[1], i)));
  els.source.replaceChildren(...Object.entries(SOURCES).map(([id, name]) => new Option(name, id)));

  try {
    const saved = JSON.parse(localStorage.getItem('sharedBible') || 'null');
    if (saved && BOOKS[saved.book] && SOURCES[saved.source] && saved.chapter >= 1 && saved.chapter <= CHAPTERS[saved.book]) {
      Object.assign(state, { book: saved.book, chapter: saved.chapter, source: saved.source, sourceIsManual: !!saved.sourceIsManual });
    }
  } catch (e) { /* ignore bad saved state */ }

  els.book.addEventListener('change', () => go(+els.book.value, 1));
  els.chapter.addEventListener('change', () => go(state.book, +els.chapter.value));
  els.source.addEventListener('change', () => { state.source = els.source.value; state.sourceIsManual = true; render(); });
  els.pane1.addEventListener('click', (e) => {
    const num = e.target.closest('.v[data-c] sup');
    if (num) jumpToCommentary(num.parentElement.dataset.c);
  });
  document.querySelectorAll('.pgdn').forEach((btn) => btn.addEventListener('click', () => {
    const pane = $(btn.dataset.pane);
    pane.scrollBy({ top: pane.clientHeight - 48, behavior: 'smooth' });
  }));
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  render();
}

// Display prefs: font size applies to both panes via --fs; theme overrides the system setting once toggled.
const prefs = { fs: 17, theme: null };
const systemDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
const isDark = () => (prefs.theme ? prefs.theme === 'dark' : systemDark());

function applyPrefs() {
  document.documentElement.style.setProperty('--fs', `${prefs.fs}px`);
  if (prefs.theme) document.documentElement.setAttribute('data-theme', prefs.theme);
  $('theme').textContent = isDark() ? '\u2600 Light' : '\u263E Dark';
  try { localStorage.setItem('sharedBiblePrefs', JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ }
}

function initPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem('sharedBiblePrefs') || 'null');
    if (saved) {
      if (saved.fs >= 12 && saved.fs <= 32) prefs.fs = saved.fs;
      if (saved.theme === 'light' || saved.theme === 'dark') prefs.theme = saved.theme;
    }
  } catch (e) { /* ignore bad saved prefs */ }
  $('fontUp').addEventListener('click', () => { prefs.fs = Math.min(32, prefs.fs + 2); applyPrefs(); });
  $('fontDown').addEventListener('click', () => { prefs.fs = Math.max(12, prefs.fs - 2); applyPrefs(); });
  $('theme').addEventListener('click', () => { prefs.theme = isDark() ? 'light' : 'dark'; applyPrefs(); });
  applyPrefs();
}

initPrefs();
init();
</script>
</body>
</html>
