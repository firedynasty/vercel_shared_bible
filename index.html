<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Tools</title>
<style>
  :root { --bg:#faf8f4; --fg:#222; --muted:#777; --line:#ddd; --accent:#8a5a2b; --pane:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --pane:#1d1f23; }
  }
  :root[data-theme="dark"] { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --pane:#1d1f23; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: system-ui, sans-serif; font-size: 14px; }
  header .sp { flex: 1; }
  header strong { font-weight: 600; color: var(--accent); }
  button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--pane); color: var(--fg); cursor: pointer; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .lead { margin: 0 0 26px; color: var(--muted); font: 15px/1.6 system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--pane); border: 1px solid var(--line); border-left: 5px solid var(--tint, var(--accent)); border-radius: 10px; padding: 14px 16px; transition: transform .08s ease, box-shadow .12s ease; }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.14); outline: none; }
  a.card .name { font: 600 16px/1.3 system-ui, sans-serif; color: var(--tint, var(--accent)); }
  a.card .blurb { margin-top: 5px; font: 14px/1.5 system-ui, sans-serif; color: var(--muted); }
  .soon { margin: 30px 0 0; font: 13px/1.6 system-ui, sans-serif; color: var(--muted); }
  .soon code { font-size: 12px; background: var(--pane); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>

<header>
  <strong>Bible Tools</strong>
  <span class="sp"></span>
  <button id="theme" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
</header>

<main>
  <h1>Pick a page</h1>
  <p class="lead">Nothing opens on its own — tap one of these.</p>
  <div class="grid" id="grid"></div>
  <p class="soon">To add a page: drop <code>page2.html</code> in this folder and add one line to the <code>PAGES</code> list at the bottom of <code>index.html</code>.</p>
</main>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// The whole menu. Add a page = add a line here (href, name, blurb, tint).
// ─────────────────────────────────────────────────────────────────────────────
var PAGES = [
  { href: 'commentary.html', name: 'Commentary',    tint: '#0f766e', blurb: 'Two panes: Berean Standard Bible beside John Gill / Matthew Henry, fetched live.' },
  { href: 'chinese.html',    name: 'Chinese Gloss', tint: '#dc2626', blurb: 'Genesis in Chinese, word by word — touch or dwell on a word for pinyin and gloss.' }
];

var grid = document.getElementById('grid');
PAGES.forEach(function (p) {
  var a = document.createElement('a');
  a.className = 'card';
  a.href = p.href;
  if (p.tint) a.style.setProperty('--tint', p.tint);
  var n = document.createElement('div');
  n.className = 'name';
  n.textContent = p.name;
  var b = document.createElement('div');
  b.className = 'blurb';
  b.textContent = p.blurb || '';
  a.appendChild(n);
  a.appendChild(b);
  grid.appendChild(a);
});

// Theme, shared with commentary.html through the same localStorage key.
var btn = document.getElementById('theme');
function readPrefs() {
  try { return JSON.parse(localStorage.getItem('sharedBiblePrefs') || 'null') || {}; }
  catch (e) { return {}; }
}
function label() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
  btn.textContent = dark ? '☀' : '☾';
}
var prefs = readPrefs();
if (prefs.theme) document.documentElement.setAttribute('data-theme', prefs.theme);
label();
btn.addEventListener('click', function () {
  var now = document.documentElement.getAttribute('data-theme');
  if (!now) now = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  var p = readPrefs();
  p.theme = next;
  try { localStorage.setItem('sharedBiblePrefs', JSON.stringify(p)); } catch (e) { /* storage unavailable */ }
  label();
});
</script>
</body>
</html>
