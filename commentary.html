<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Bible</title>
<style>
  :root { --bg:#faf8f4; --fg:#222; --muted:#777; --line:#ddd; --accent:#8a5a2b; --link:#8a4b1f; --pane:#fff; }
  :root { --fs: 17px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --link:#e0a96d; --pane:#1d1f23; }
  }
  :root[data-theme="dark"] { --bg:#16171a; --fg:#e6e6e6; --muted:#9a9a9a; --line:#33353a; --accent:#d9a066; --link:#e0a96d; --pane:#1d1f23; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 Georgia, serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: system-ui, sans-serif; font-size: 14px; }
  header .sp { flex: 1; }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--pane); color: var(--fg); }
  button { cursor: pointer; }
  a.home { text-decoration: none; color: var(--fg); padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--pane); line-height: 1.4; }
  a.home:hover { color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { font-size: var(--fs); overflow-y: auto; padding: 16px 20px 60px; background: var(--pane); }
  .wrap { position: relative; display: flex; min-height: 0; min-width: 0; }
  .wrap + .wrap { border-left: 1px solid var(--line); }
  .pane { flex: 1; min-width: 0; }
  .pgdn { position: absolute; right: 24px; bottom: 12px; width: 40px; height: 40px; padding: 0; border-radius: 50%; opacity: .85; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .pane h2 { margin: 0 0 12px; font: 600 15px system-ui, sans-serif; color: var(--accent); }
  .pane.intro-select .v sup { cursor: pointer; text-decoration: underline dotted var(--link); text-underline-offset: 3px; }
  .pane.intro-select .v sup:hover { color: var(--link); }
  .intro-ref { color: var(--link); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; white-space: nowrap; }
  .intro-ref:hover { text-decoration-style: solid; }
  /* Outline headings: the words carry the weight, the reference stays quiet beside them.
     The left margin is set per line in renderIntro; these rules only set rhythm and size. */
  .intro-line { margin: 0 0 3px; padding-left: 1.3em; text-indent: -1.3em; }
  .intro-line.lvl1 { margin-top: 26px; margin-bottom: 6px; font-weight: 600; }
  .intro-line.lvl2 { margin-top: 12px; margin-bottom: 4px; font-size: .97em; }
  .intro-line.lvl3 { margin-top: 9px; font-size: .95em; }
  .intro-line.lvl4 { margin-top: 4px; font-size: .94em; }
  .intro-line.cont { text-indent: 0; margin-top: 0; }   /* a wrapped second line of the entry above */
  .intro-line.flush { padding-left: 0; text-indent: 0; }
  .intro-line.cont.flush { margin: 0 0 12px; }          /* a plain paragraph, not an outline entry */
  .intro-line.lead { margin: 20px 0 2px; font-weight: 600; }
  .pane h2 + .intro-line.lead { margin-top: 0; }
  .pane h2 + .intro-line { margin-top: 0; }
  .intro-line .intro-ref { font-size: .88em; color: var(--muted); text-decoration-color: var(--line); }
  .intro-line .intro-ref:hover { color: var(--link); text-decoration-color: currentColor; }
  .intro-chapter { margin: 10px 0 16px; padding: 10px 14px; border-left: 3px solid var(--line); border-radius: 0 8px 8px 0; background: rgba(138,90,43,.055); }
  .intro-chapter h4 { margin: 0 0 7px; font: 700 .76em/1.4 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .intro-overview { margin: 0; font-size: .97em; }
  .intro-sections { margin: 0 0 10px; padding: 0; list-style: none; }
  .intro-sections li { margin: 0 0 5px; padding-left: 1.2em; text-indent: -1.2em; font-size: .97em; }
  .intro-sections .intro-label { margin-left: .3em; }
  .pane2-modes { display: inline-flex; gap: 0; }
  .pane2-modes button { border-radius: 0; }
  .pane2-modes button:first-child { border-radius: 6px 0 0 6px; }
  .pane2-modes button:last-child { border-radius: 0 6px 6px 0; }
  .pane2-modes button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .para { margin: 0 0 14px; }
  .summary { margin: 0 0 20px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; background: rgba(217,160,102,.08); }
  .summary .ov { margin: 0 0 10px; font: 1em/1.55 system-ui, sans-serif; }
  .summary ul { margin: 0; padding: 0; list-style: none; font: 1em/1.5 system-ui, sans-serif; }
  .summary li { margin: 0 0 4px; display: flex; gap: 8px; }
  .summary .r { flex: none; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  .summary .r:hover { text-decoration-style: solid; }
  h3.heading { margin: 22px 0 8px; font: 700 1em system-ui, sans-serif; }
  .sub { font-style: italic; color: var(--muted); margin: 0 0 8px; }
  .poem { display: block; }
  .poem.p1 { padding-left: 1.2em; text-indent: -0.0em; }
  .poem.p2 { padding-left: 2.4em; }
  .poem.p3 { padding-left: 3.6em; }
  .v sup { color: var(--accent); font: 600 12px system-ui, sans-serif; margin-right: 4px; }
  .v.hl { background: rgba(217,160,102,.25); border-radius: 4px; }
  .v.has sup, .v.cov sup { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; cursor: pointer; }
  .v.cov sup { text-decoration-style: dotted; }
  .c.flash { background: rgba(217,160,102,.25); border-radius: 4px; }
  .c { margin: 0 0 16px; white-space: pre-wrap; }
  .c .ref { display: block; color: var(--accent); font: 600 13px system-ui, sans-serif; margin-bottom: 2px; }
  .msg { color: var(--muted); font-family: system-ui, sans-serif; }
  button.ref { background: #3b82f6; color: #fff; border-color: #3b82f6; font-size: 12px; font-weight: 600; padding: 2px 8px; }
  button.clr { background: #ef4444; color: #fff; border-color: #ef4444; font-size: 12px; font-weight: 600; padding: 2px 8px; }
  button.clr:hover { background: #dc2626; }
  button.clr.on { background: #16a34a; border-color: #16a34a; }
  button.ref:hover { background: #2563eb; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; display: flex; justify-content: center; align-items: center; font-family: system-ui, sans-serif; }
  .modal[hidden] { display: none; }
  .modal .box { background: var(--pane); color: var(--fg); border-radius: 14px; padding: 20px; width: 90%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .modal h3 { margin: 0 0 12px; font-size: 16px; text-align: center; }
  .modal input { width: 100%; padding: 8px 10px; font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  .modal .err { color: #dc2626; font-size: 13px; min-height: 1.2em; margin: 6px 0; }
  .modal .recent { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .wrap + .wrap { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="/" title="All pages" aria-label="All pages">&#9776;</a>
  <button id="refBtn" class="ref" title="Go to a Bible reference (e)">Ref(e)</button>
  <select id="book" aria-label="Book"></select>
  <select id="chapter" aria-label="Chapter"></select>
  <button id="prev" aria-label="Previous chapter">&larr;</button>
  <button id="next" aria-label="Next chapter">&rarr;</button>
  <span class="sp"></span>
  <button id="fontDown" aria-label="Smaller text" title="Smaller text">A&minus;</button>
  <button id="fontUp" aria-label="Larger text" title="Larger text">A+</button>
  <button id="theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>
  <button id="clr1" class="clr" title="Empty pane 1 (e.g. so the Bible text does not interfere when you search the page). Pane 2 keeps its own column, so the lines stay as wide as they were.">clr pane 1</button>
  <button id="clr2" class="clr" title="Empty pane 2 (e.g. so it does not interfere when you search the page). Click a verse number in pane 1 to bring commentary back at that verse.">clr pane 2</button>
  <span class="pane2-modes" role="group" aria-label="Pane 2 view">
    <button id="showIntro" type="button" aria-pressed="false">Intro</button>
    <button id="showCommentary" type="button" aria-pressed="true">Commentary</button>
  </span>
  <label id="sourceLabel">Commentary <select id="source"></select></label>
</header>
<main>
  <div class="wrap">
    <section class="pane" id="pane1"></section>
    <button class="pgdn" data-pane="pane1" aria-label="Page down in pane 1" title="Page down">&#9660;</button>
  </div>
  <div class="wrap">
    <section class="pane" id="pane2"></section>
    <button class="pgdn" data-pane="pane2" aria-label="Page down in pane 2" title="Page down">&#9660;</button>
  </div>
</main>

<div class="modal" id="refModal" hidden>
  <div class="box">
    <h3>Go to Reference</h3>
    <input id="refInput" type="text" autocomplete="off" placeholder="John 3:16, 1 Cor 13, Ps 23, or paste a BibleGateway link">
    <div class="err" id="refErr"></div>
    <div class="recent" id="refRecent"></div>
    <div class="row"><button id="refCancel">Cancel</button><button id="refGo" class="ref">Go</button></div>
  </div>
</div>

<script>
// [abbrev, name, HelloAO book id]
const BOOKS = [
  ['gn','Genesis','GEN'],['ex','Exodus','EXO'],['lv','Leviticus','LEV'],['nm','Numbers','NUM'],['dt','Deuteronomy','DEU'],
  ['js','Joshua','JOS'],['jud','Judges','JDG'],['rt','Ruth','RUT'],['1sm','1 Samuel','1SA'],['2sm','2 Samuel','2SA'],
  ['1kgs','1 Kings','1KI'],['2kgs','2 Kings','2KI'],['1ch','1 Chronicles','1CH'],['2ch','2 Chronicles','2CH'],['ezr','Ezra','EZR'],
  ['ne','Nehemiah','NEH'],['et','Esther','EST'],['job','Job','JOB'],['ps','Psalms','PSA'],['prv','Proverbs','PRO'],
  ['ec','Ecclesiastes','ECC'],['so','Song of Solomon','SNG'],['is','Isaiah','ISA'],['jr','Jeremiah','JER'],['lm','Lamentations','LAM'],
  ['ez','Ezekiel','EZK'],['dn','Daniel','DAN'],['ho','Hosea','HOS'],['jl','Joel','JOL'],['am','Amos','AMO'],
  ['ob','Obadiah','OBA'],['jn','Jonah','JON'],['mi','Micah','MIC'],['na','Nahum','NAM'],['hk','Habakkuk','HAB'],
  ['zp','Zephaniah','ZEP'],['hg','Haggai','HAG'],['zc','Zechariah','ZEC'],['ml','Malachi','MAL'],
  ['mt','Matthew','MAT'],['mk','Mark','MRK'],['lk','Luke','LUK'],['jo','John','JHN'],['act','Acts','ACT'],
  ['rm','Romans','ROM'],['1co','1 Corinthians','1CO'],['2co','2 Corinthians','2CO'],['gl','Galatians','GAL'],['eph','Ephesians','EPH'],
  ['ph','Philippians','PHP'],['cl','Colossians','COL'],['1ts','1 Thessalonians','1TH'],['2ts','2 Thessalonians','2TH'],
  ['1tm','1 Timothy','1TI'],['2tm','2 Timothy','2TI'],['tt','Titus','TIT'],['phm','Philemon','PHM'],['hb','Hebrews','HEB'],
  ['jm','James','JAS'],['1pe','1 Peter','1PE'],['2pe','2 Peter','2PE'],['1jo','1 John','1JN'],['2jo','2 John','2JN'],
  ['3jo','3 John','3JN'],['jd','Jude','JUD'],['re','Revelation','REV'],
];
const OT_COUNT = 39;
const SOURCES = { 'john-gill': 'John Gill', 'matthew-henry': 'Matthew Henry' };
const COMMENTARY_API = 'https://bible.helloao.org/api/c';
const BIBLE_API = 'https://bible.helloao.org/api/BSB';
// chapters per book, same order as BOOKS
const CHAPTERS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,
  28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];

// Book name / abbreviation -> internal abbrev (same table as the main Bible app)
const BOOK_ALIASES = {
  // Full names
  'genesis': 'gn', 'exodus': 'ex', 'leviticus': 'lv', 'numbers': 'nm', 'deuteronomy': 'dt',
  'joshua': 'js', 'judges': 'jud', 'ruth': 'rt', '1 samuel': '1sm', '2 samuel': '2sm',
  '1 kings': '1kgs', '2 kings': '2kgs', '1 chronicles': '1ch', '2 chronicles': '2ch',
  'ezra': 'ezr', 'nehemiah': 'ne', 'esther': 'et', 'job': 'job', 'psalm': 'ps', 'psalms': 'ps',
  'proverbs': 'prv', 'ecclesiastes': 'ec', 'song of solomon': 'so', 'isaiah': 'is',
  'jeremiah': 'jr', 'lamentations': 'lm', 'ezekiel': 'ez', 'daniel': 'dn',
  'hosea': 'ho', 'joel': 'jl', 'amos': 'am', 'obadiah': 'ob', 'jonah': 'jn',
  'micah': 'mi', 'nahum': 'na', 'habakkuk': 'hk', 'zephaniah': 'zp', 'haggai': 'hg',
  'zechariah': 'zc', 'malachi': 'ml', 'matthew': 'mt', 'mark': 'mk', 'luke': 'lk',
  'john': 'jo', 'acts': 'act', 'romans': 'rm', '1 corinthians': '1co', '2 corinthians': '2co',
  'galatians': 'gl', 'ephesians': 'eph', 'philippians': 'ph', 'colossians': 'cl',
  '1 thessalonians': '1ts', '2 thessalonians': '2ts', '1 timothy': '1tm', '2 timothy': '2tm',
  'titus': 'tt', 'philemon': 'phm', 'hebrews': 'hb', 'james': 'jm', '1 peter': '1pe',
  '2 peter': '2pe', '1 john': '1jo', '2 john': '2jo', '3 john': '3jo', 'jude': 'jd',
  'revelation': 're',
  // Short abbreviations
  'gen': 'gn', 'exo': 'ex', 'exod': 'ex', 'ex': 'ex', 'lev': 'lv', 'num': 'nm', 'deut': 'dt', 'deu': 'dt',
  'josh': 'js', 'jos': 'js', 'judg': 'jud',
  '1sam': '1sm', '1 sam': '1sm', '2sam': '2sm', '2 sam': '2sm',
  '1kgs': '1kgs', '1 kgs': '1kgs', '2kgs': '2kgs', '2 kgs': '2kgs',
  '1chr': '1ch', '1 chr': '1ch', '2chr': '2ch', '2 chr': '2ch',
  'neh': 'ne', 'est': 'et', 'ps': 'ps', 'psa': 'ps',
  'prov': 'prv', 'pro': 'prv', 'eccl': 'ec', 'ecc': 'ec',
  'song': 'so', 'sos': 'so', 'songs': 'so',
  'isa': 'is', 'jer': 'jr', 'lam': 'lm', 'ezek': 'ez', 'eze': 'ez',
  'dan': 'dn', 'hos': 'ho', 'oba': 'ob', 'ob': 'ob', 'jon': 'jn',
  'mic': 'mi', 'nah': 'na', 'hab': 'hk', 'zeph': 'zp', 'zep': 'zp',
  'hag': 'hg', 'zech': 'zc', 'zec': 'zc', 'mal': 'ml',
  'matt': 'mt', 'mat': 'mt', 'mrk': 'mk', 'mk': 'mk', 'luk': 'lk', 'lk': 'lk',
  'joh': 'jo', 'jn': 'jo', 'rom': 'rm',
  '1cor': '1co', '1 cor': '1co', '2cor': '2co', '2 cor': '2co',
  'gal': 'gl', 'eph': 'eph', 'phil': 'ph', 'php': 'ph', 'col': 'cl',
  '1thess': '1ts', '1 thess': '1ts', '2thess': '2ts', '2 thess': '2ts',
  '1tim': '1tm', '1 tim': '1tm', '2tim': '2tm', '2 tim': '2tm',
  'tit': 'tt', 'phlm': 'phm', 'phm': 'phm', 'heb': 'hb',
  'jas': 'jm', 'jam': 'jm',
  '1pet': '1pe', '1 pet': '1pe', '2pet': '2pe', '2 pet': '2pe',
  '1jn': '1jo', '1 jn': '1jo', '2jn': '2jo', '2 jn': '2jo', '3jn': '3jo', '3 jn': '3jo',
  'rev': 're', 're': 're', 'revelations': 're'
};

// "John 3:16", "1 cor 13", "Ps 23:1-4", "Genesis", a bare chapter number, or a BibleGateway link.
// Returns { book, chapter, verse } or { error }.
function parseRef(input, currentBook) {
  let text = input.trim();
  const link = text.match(/^https?:\/\/(?:www\.)?biblegateway\.com\/passage\/?\?[^\s]*/i);
  if (link) {
    const m = link[0].match(/[?&]search=([^&#\s]+)/i);
    if (m) { try { text = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { /* keep raw */ } }
    const frag = link[0].match(/#v(\d+)/i);
    if (frag && !/:/.test(text)) text += `:${frag[1]}`;
  }
  if (!text) return { error: 'Type a reference, e.g. John 3:16' };

  let bookName = null, chapter = 1, verse = null;
  let m = text.match(/^(\d?\s*[A-Za-z]+(?:\s+of\s+[A-Za-z]+)?)\.?\s+(\d+)(?::(\d+))?/);
  if (m) { bookName = m[1]; chapter = +m[2]; verse = m[3] ? +m[3] : null; }
  else if ((m = text.match(/^(\d?\s*[A-Za-z]+(?:\s+of\s+[A-Za-z]+)?)\.?$/))) bookName = m[1];
  else if ((m = text.match(/^(\d+)(?::(\d+))?$/))) { chapter = +m[1]; verse = m[2] ? +m[2] : null; }
  else return { error: `Couldn't read "${text}"` };

  let book = currentBook;
  if (bookName) {
    const abbrev = BOOK_ALIASES[bookName.trim().toLowerCase().replace(/\s+/g, ' ')];
    book = BOOKS.findIndex((b) => b[0] === abbrev);
    if (book < 0) return { error: `Unknown book "${bookName.trim()}"` };
  }
  if (chapter < 1 || chapter > CHAPTERS[book]) return { error: `${BOOKS[book][1]} has ${CHAPTERS[book]} chapters` };
  return { book, chapter, verse };
}

const $ = (id) => document.getElementById(id);
const els = { book: $('book'), chapter: $('chapter'), source: $('source'), sourceLabel: $('sourceLabel'), pane1: $('pane1'), pane2: $('pane2') };

const state = { book: 0, chapter: 1, source: 'john-gill', sourceIsManual: false, pane2Mode: 'commentary' };
const bibleCache = {};      // "BOOK/chapter" -> parsed json
const commentaryCache = {}; // "source/BOOK/chapter" -> parsed json
let introData = null;
let introDataPromise = null;
let renderToken = 0;
let pane1Cleared = false;     // session-only: when true, pane 1 stays empty and no Bible text is rendered
// where each pane was when it was emptied, so it comes back there and not at the top.
// Keyed by what was on screen, so a chapter or source change does not restore a stale offset.
const paneSpot = { 1: { key: '', top: 0 }, 2: { key: '', top: 0 } };
let pane2Cleared = false;     // session-only: when true, pane 2 stays empty and no commentary is rendered
let restoreScroll = null;     // [pane1, pane2] scrollTop saved last visit, applied once after the first render
let pendingVerse = null;      // verse to highlight once a navigation finishes rendering
let recent = [];              // last visited { book, chapter }, newest first

const defaultSource = (bookIdx) => (bookIdx < OT_COUNT ? 'john-gill' : 'matthew-henry');

function setMsg(pane, text) {
  pane.replaceChildren();
  const p = document.createElement('p');
  p.className = 'msg';
  p.textContent = text;
  pane.appendChild(p);
}

async function loadBible(bookIdx, chapter) {
  const key = `${BOOKS[bookIdx][2]}/${chapter}`;
  if (!bibleCache[key]) {
    const res = await fetch(`${BIBLE_API}/${key}.json`);
    if (!res.ok) throw new Error(`Could not load BSB ${BOOKS[bookIdx][1]} ${chapter} (${res.status})`);
    bibleCache[key] = await res.json();
  }
  return bibleCache[key];
}

async function loadCommentary(source, bookIdx, chapter) {
  const key = `${source}/${BOOKS[bookIdx][2]}/${chapter}`;
  if (!commentaryCache[key]) {
    const res = await fetch(`${COMMENTARY_API}/${source}/${BOOKS[bookIdx][2]}/${chapter}.json`);
    if (!res.ok) throw new Error(`${SOURCES[source]} has no entry for this chapter (${res.status})`);
    commentaryCache[key] = await res.json();
  }
  return commentaryCache[key];
}

async function loadIntroData() {
  if (introData) return introData;
  if (!introDataPromise) {
    introDataPromise = fetch('bible_intro.json')
      .then((res) => {
        if (!res.ok) throw new Error(`Could not load book introductions (${res.status})`);
        return res.json();
      })
      .then((data) => { introData = data; return data; })
      .catch((err) => { introDataPromise = null; throw err; });
  }
  return introDataPromise;
}

// Chapter summaries, one small file per book (built by build_summaries.py).
// A book with no file simply renders without a summary block.
const summaryCache = {};
async function loadSummaries(bookIdx) {
  const abbrev = BOOKS[bookIdx][0];
  if (!(abbrev in summaryCache)) {
    try {
      const res = await fetch(`summaries/${abbrev}.json`);
      summaryCache[abbrev] = res.ok ? await res.json() : {};
    } catch (e) {
      summaryCache[abbrev] = {};
    }
  }
  return summaryCache[abbrev];
}

// The overview and section breakdown that sit above the chapter in pane 1.
function summaryBlock(summary) {
  const box = document.createElement('section');
  box.className = 'summary';
  const ov = document.createElement('p');
  ov.className = 'ov';
  ov.textContent = summary.overview;
  box.appendChild(ov);
  const list = document.createElement('ul');
  (summary.sections || []).forEach((s) => {
    const li = document.createElement('li');
    const r = document.createElement('span');
    r.className = 'r';
    r.textContent = s.start_verse === s.end_verse
      ? `${state.chapter}:${s.start_verse}`
      : `${state.chapter}:${s.start_verse}\u2013${s.end_verse}`;
    r.title = `Go to verse ${s.start_verse}`;
    r.addEventListener('click', () => highlight(s.start_verse));
    const t = document.createElement('span');
    t.textContent = s.heading;
    li.append(r, t);
    list.appendChild(li);
  });
  box.appendChild(list);
  return box;
}

// HelloAO verse content is a list of strings; join and ignore any non-string parts.
const flatten = (parts) => (parts || []).filter((x) => typeof x === 'string').join(' ').trim();

// BSB chapter content is a sequence of headings, verses and line breaks (paragraph ends).
// A verse's parts are plain strings, poetry lines ({text, poem}), footnote ids (skipped) and inline breaks.
function renderBible(json, summary) {
  els.pane1.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = `${BOOKS[state.book][1]} ${state.chapter} (BSB)`;
  els.pane1.appendChild(h);
  if (summary) els.pane1.appendChild(summaryBlock(summary));

  let para = null;
  const paragraph = () => {
    if (!para) { para = document.createElement('p'); para.className = 'para'; els.pane1.appendChild(para); }
    return para;
  };

  (json.chapter.content || []).forEach((item) => {
    if (item.type === 'heading') {
      para = null;
      const el = document.createElement('h3');
      el.className = 'heading';
      el.textContent = flatten(item.content);
      els.pane1.appendChild(el);
    } else if (item.type === 'hebrew_subtitle') {
      para = null;
      const el = document.createElement('p');
      el.className = 'sub';
      el.textContent = flatten(item.content);
      els.pane1.appendChild(el);
    } else if (item.type === 'line_break') {
      para = null;
    } else if (item.type === 'verse') {
      const verse = document.createElement('span');
      verse.className = 'v';
      verse.dataset.v = item.number;
      let numberPlaced = false;
      const placeNumber = (host) => {
        if (numberPlaced) return;
        const n = document.createElement('sup');
        n.textContent = item.number;
        host.appendChild(n);
        numberPlaced = true;
      };
      (item.content || []).forEach((part) => {
        if (typeof part === 'string') {
          placeNumber(verse);
          verse.append(part + ' ');
        } else if (part && typeof part.text === 'string') {
          const line = document.createElement('span');
          line.className = `poem p${Math.min(part.poem || 1, 3)}`;
          placeNumber(line);
          line.append(part.text);
          verse.appendChild(line);
        } else if (part && part.lineBreak) {
          // a poetry line is already a block, so a break after it would add a blank line
          if (!verse.lastElementChild?.classList.contains('poem')) verse.appendChild(document.createElement('br'));
        }
      });
      placeNumber(verse);
      paragraph().append(verse, ' ');
    }
  });
  els.pane1.scrollTop = 0;
}

// Verse numbers that own a commentary entry with real text in it.
function verseStarts(json) {
  const chapter = json.chapter || {};
  return (chapter.content || [])
    .filter((x) => x.type === 'verse' && flatten(x.content))
    .map((x) => x.number);
}

function renderCommentary(json) {
  els.pane2.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = `${BOOKS[state.book][1]} ${state.chapter} (${SOURCES[state.source]})`;
  els.pane2.appendChild(h);
  const chapter = json.chapter || {};
  const intro = typeof chapter.introduction === 'string' ? chapter.introduction : flatten(chapter.introduction);
  if (intro) {
    const p = document.createElement('p');
    p.className = 'c';
    p.textContent = intro;
    els.pane2.appendChild(p);
  }
  const items = (chapter.content || []).filter((x) => x.type === 'verse');
  if (!items.length && !intro) {
    setMsg(els.pane2, `${SOURCES[state.source]} has no commentary for ${BOOKS[state.book][1]} ${state.chapter}.`);
    return;
  }
  items.forEach((item) => {
    const text = flatten(item.content);
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'c';
    div.dataset.v = item.number;
    const ref = document.createElement('span');
    ref.className = 'ref';
    ref.textContent = `v. ${item.number}`;
    div.append(ref, text);
    // clicking a commentary entry highlights its verse in pane 1
    div.addEventListener('click', () => highlight(item.number));
    els.pane2.appendChild(div);
  });
  els.pane2.scrollTop = 0;
  markVerses(verseStarts(json));
}

function makeIntroReference(label, chapter, verse, title = `Go to ${label}`) {
  const ref = document.createElement('span');
  ref.className = 'intro-ref';
  ref.textContent = label;
  ref.title = title;
  ref.addEventListener('click', () => go(state.book, chapter, verse));
  return ref;
}

function renderIntro(data, summaries) {
  els.pane2.replaceChildren();
  const book = BOOKS[state.book];
  const h = document.createElement('h2');
  h.textContent = `${book[1] === 'John' ? 'Gospel of John' : book[1]}: Outline with Chapter Summaries`;
  els.pane2.appendChild(h);
  const text = data[book[0]];
  if (typeof text !== 'string' || !text.trim()) {
    const missing = document.createElement('p');
    missing.className = 'msg';
    missing.textContent = `No introduction available for ${book[1]}.`;
    els.pane2.appendChild(missing);
    els.pane2.scrollTop = 0;
    return;
  }

  // The source files indent inconsistently (some "C." lines sit at column 0) and carry stray
  // runs of spaces, so the outline depth comes from the list marker, not from the whitespace.
  // "C." and "D." are both letters and Roman numerals, so each marker is read as the next one
  // in whichever sequence is already running (I, II, III… / A, B, C… / 1, 2, 3… / a, b, c…).
  const markerLevel = (() => {
    const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
    const letter = (i) => String.fromCharCode(65 + i);
    let roman = 0, upper = 0, digit = 0, lower = 0;
    return (m) => {
      if (m === ROMAN[roman]) { roman += 1; upper = digit = lower = 0; return 1; }
      if (m === letter(upper)) { upper += 1; digit = lower = 0; return 2; }
      if (m === String(digit + 1)) { digit += 1; lower = 0; return 3; }
      if (m === letter(lower).toLowerCase()) { lower += 1; return 4; }
      // out of sequence (a restarted or skipped list): go by the marker's shape and resync
      if (/^[a-z]$/.test(m)) { lower = m.charCodeAt(0) - 96; return 4; }
      if (/^\d+$/.test(m)) { digit = Number(m); lower = 0; return 3; }
      if (/^[IVXLCDM]{2,}$/.test(m) || (/^[IVXLCDM]$/.test(m) && upper === 0)) {
        roman = Math.max(roman, ROMAN.indexOf(m) + 1); upper = digit = lower = 0; return 1;
      }
      upper = m.charCodeAt(0) - 64; digit = lower = 0; return 2;
    };
  })();

  const markerPattern = /^([IVXLCDM]+|[A-Za-z]|\d+)\.\s+/;
  let lastLevel = 1;
  let sawOutline = false;
  const lines = text.split('\n').map((raw) => {
    const clean = raw.replace(/\s+/g, ' ').trim();
    if (!clean) return null;
    const marker = clean.match(markerPattern)?.[1];
    // A marker only makes an outline entry when the line names a passage, or reads as a title:
    // short and not a finished sentence. Revelation opens with eight numbered paragraphs.
    const isEntry = !!marker && (/\(\d+:\d+/.test(clean) || (clean.length <= 120 && !/[.!?]$/.test(clean)));
    if (isEntry) { lastLevel = markerLevel(marker); sawOutline = true; }
    // A short unmarked line ahead of the outline is a heading of its own (Psalms: "Book 1").
    const lead = !isEntry && !sawOutline && clean.length <= 60 && !/[.!?,;:]$/.test(clean);
    return { text: clean, level: lastLevel, entry: isEntry, indented: sawOutline, lead };
  }).filter(Boolean);

  const rangePattern = /\((\d+):(\d+)(?:[–-](\d+)(?::(\d+))?)?\)/g;
  const outlineNodes = [];
  lines.forEach((line, lineIndex) => {
    const match = rangePattern.exec(line.text);
    rangePattern.lastIndex = 0;
    if (!match) return;
    const startChapter = Number(match[1]);
    const startVerse = Number(match[2]);
    const hasEnd = match[3] !== undefined;
    const endChapter = hasEnd && match[4] !== undefined ? Number(match[3]) : startChapter;
    const endVerse = match[4] !== undefined ? Number(match[4]) : hasEnd ? Number(match[3]) : startVerse;
    outlineNodes.push({
      lineIndex,
      indent: line.level,
      start: startChapter * 1000 + startVerse,
      end: endChapter * 1000 + endVerse,
    });
  });

  const findOutlineNode = (chapter, startVerse, endVerse) => {
    const start = chapter * 1000 + startVerse;
    const end = chapter * 1000 + endVerse;
    const containing = outlineNodes.filter((node) => node.start <= start && node.end >= start);
    if (containing.length) {
      return containing.sort((a, b) => (a.end - a.start) - (b.end - b.start) || b.indent - a.indent)[0];
    }
    const overlapping = outlineNodes
      .map((node) => ({ node, overlap: Math.max(0, Math.min(node.end, end) - Math.max(node.start, start)) }))
      .filter((item) => item.overlap > 0)
      .sort((a, b) => b.overlap - a.overlap || (a.node.end - a.node.start) - (b.node.end - b.node.start));
    return overlapping[0]?.node || null;
  };

  const splitOverview = (overview, groupCount) => {
    if (!overview || groupCount <= 1) return overview ? [overview] : [];
    const sentences = overview.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [overview];
    return sentences.flatMap((sentence) => {
      const parts = sentence.split(/,\s+(?=while\b)/i);
      if (parts.length < 2) return [sentence.trim()];
      const first = parts[0].trim().replace(/,$/, '');
      const rest = parts.slice(1).map((part) => {
        const trimmed = part.trim();
        return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
      });
      return [`${first}.`, ...rest];
    });
  };

  const assignOverview = (chunks, groups) => {
    if (!groups.length) return [];
    if (chunks.length < groups.length) {
      return groups.map((_, i) => chunks[i] || '');
    }
    const result = [];
    const totalWeight = groups.reduce((sum, group) => sum + Math.max(1, group.sections.length), 0);
    let cursor = 0;
    let remainingWeight = totalWeight;
    groups.forEach((group, index) => {
      const remainingChunks = chunks.length - cursor;
      const remainingGroups = groups.length - index;
      const weight = Math.max(1, group.sections.length);
      const take = index === groups.length - 1
        ? remainingChunks
        : Math.max(1, Math.min(remainingChunks - (remainingGroups - 1), Math.round(remainingChunks * weight / remainingWeight)));
      result.push(chunks.slice(cursor, cursor + take).join(' '));
      cursor += take;
      remainingWeight -= weight;
    });
    return result;
  };

  const insertions = new Map();
  const unattached = [];
  for (let chapter = 1; chapter <= CHAPTERS[state.book]; chapter += 1) {
    const info = summaries?.[chapter];
    if (!info) continue;
    const groupsByLine = new Map();
    const items = Array.isArray(info.sections) ? info.sections : [];
    items.forEach((item) => {
      const node = findOutlineNode(chapter, item.start_verse, item.end_verse);
      const lineIndex = node?.lineIndex ?? null;
      if (!groupsByLine.has(lineIndex)) groupsByLine.set(lineIndex, { chapter, lineIndex, indent: node?.indent || 0, sections: [], overview: '' });
      groupsByLine.get(lineIndex).sections.push(item);
    });
    if (!groupsByLine.size && info.overview) {
      const node = findOutlineNode(chapter, 1, 1);
      const lineIndex = node?.lineIndex ?? null;
      groupsByLine.set(lineIndex, { chapter, lineIndex, indent: node?.indent || 0, sections: [], overview: '' });
    }
    const groups = [...groupsByLine.values()].sort((a, b) => (a.lineIndex ?? Infinity) - (b.lineIndex ?? Infinity));
    const overviewParts = assignOverview(splitOverview(info.overview || '', groups.length), groups);
    groups.forEach((group, index) => {
      group.part = groups.length > 1 ? index + 1 : null;
      group.overview = overviewParts[index] || '';
      if (group.lineIndex === null) unattached.push(group);
      else {
        if (!insertions.has(group.lineIndex)) insertions.set(group.lineIndex, []);
        insertions.get(group.lineIndex).push(group);
      }
    });
  }

  const renderChapterGroup = (group) => {
    const section = document.createElement('section');
    section.className = 'intro-chapter';
    section.style.marginLeft = `${1.3 * Math.max(0, group.indent)}em`;
    const heading = document.createElement('h4');
    heading.textContent = `Chapter ${group.chapter}${group.part ? ` · part ${group.part}` : ''}`;
    section.appendChild(heading);
    if (group.sections.length) {
      const list = document.createElement('ul');
      list.className = 'intro-sections';
      group.sections.forEach((item) => {
        const li = document.createElement('li');
        const range = item.start_verse === item.end_verse
          ? `${group.chapter}:${item.start_verse}`
          : `${group.chapter}:${item.start_verse}–${item.end_verse}`;
        li.appendChild(makeIntroReference(range, group.chapter, item.start_verse, `Go to ${book[1]} ${group.chapter}:${item.start_verse}`));
        li.append(document.createTextNode(' '));   // a real space, so copied text and page search read right
        const label = document.createElement('span');
        label.className = 'intro-label';     // keeps the heading off the verse range
        label.textContent = item.heading;
        li.appendChild(label);
        list.appendChild(li);
      });
      section.appendChild(list);
    }
    if (group.overview) {
      const overview = document.createElement('p');
      overview.className = 'intro-overview';
      overview.textContent = group.overview;
      section.appendChild(overview);
    }
    return section;
  };

  lines.forEach((line, lineIndex) => {
    const row = document.createElement('div');
    row.className = `intro-line lvl${line.level}${line.entry ? '' : ' cont'}${line.indented ? '' : ' flush'}${line.lead ? ' lead' : ''}`;
    row.style.marginLeft = line.indented ? `${1.3 * (line.level - 1)}em` : '0';
    const refs = /\((\d+):(\d+)(?:[–-]\d+(?::\d+)?)?\)/g;
    let position = 0;
    let match;
    while ((match = refs.exec(line.text)) !== null) {
      if (match.index > position) row.append(document.createTextNode(line.text.slice(position, match.index)));
      const label = match[0].slice(1, -1);   // the parentheses only add noise beside the heading
      row.appendChild(makeIntroReference(label, Number(match[1]), Number(match[2]), `Go to ${book[1]} ${label}`));
      position = match.index + match[0].length;
    }
    if (position < line.text.length) row.append(document.createTextNode(line.text.slice(position)));
    els.pane2.appendChild(row);
    (insertions.get(lineIndex) || []).forEach((group) => els.pane2.appendChild(renderChapterGroup(group)));
  });
  unattached.forEach((group) => els.pane2.appendChild(renderChapterGroup(group)));
  els.pane2.scrollTop = 0;
}

function setPane2Mode(mode, verse = null) {
  if (mode !== 'intro' && mode !== 'commentary') return;
  pendingVerse = verse;
  state.pane2Mode = mode;
  if (pane2Cleared) {
    pane2Cleared = false;
    $('clr2').textContent = 'clr pane 2';
    $('clr2').classList.remove('on');
  }
  render();
}

// Underline the verse numbers in pane 1 that have commentary: solid = own entry, dotted = covered by an earlier section.
function markVerses(starts) {
  const sorted = [...new Set(starts)].sort((a, b) => a - b);
  els.pane1.querySelectorAll('.v').forEach((el) => {
    const v = +el.dataset.v;
    let owner = null;
    for (const n of sorted) { if (n <= v) owner = n; else break; }
    if (owner === null) return;
    el.dataset.c = owner;
    el.classList.add(owner === v ? 'has' : 'cov');
  });
}

// Either pane can be emptied, by its button or by right-clicking the pane itself.
// Both panes keep their columns either way, so line width never changes.
function setPanesCleared(p1, p2) {
  const k1 = state.book + ':' + state.chapter;
  const k2 = (state.pane2Mode === 'intro' ? 'intro' : state.source) + '/' + k1;
  const wasP1 = pane1Cleared, wasP2 = pane2Cleared;
  pane1Cleared = p1;
  pane2Cleared = p2;
  for (const [id, off, show, clear] of [['clr1', p1, 'show pane 1', 'clr pane 1'], ['clr2', p2, 'show pane 2', 'clr pane 2']]) {
    const btn = $(id);
    btn.textContent = off ? show : clear;
    btn.classList.toggle('on', off);
  }
  // Emptying a pane is not navigation. The pane left on screen keeps its place,
  // and the one being emptied has its place put aside for when it comes back.
  // (render() rebuilds both, and renderBible sends pane 1 back to the top.)
  restoreScroll = [spot(1, k1, p1, wasP1, els.pane1), spot(2, k2, p2, wasP2, els.pane2)];
  return render();
}

// One pane's scrollTop for the render that is about to run.
function spot(n, key, clearing, wasCleared, pane) {
  if (clearing) {
    if (!wasCleared) paneSpot[n] = { key, top: pane.scrollTop };   // on the way out
    return 0;
  }
  if (wasCleared) return paneSpot[n].key === key ? paneSpot[n].top : 0;   // on the way back
  return pane.scrollTop;                                                  // untouched, stay put
}

function jumpToCommentary(verse) {
  const target = els.pane2.querySelector(`.c[data-v="${verse}"]`);
  if (!target) return;
  const top = target.getBoundingClientRect().top - els.pane2.getBoundingClientRect().top + els.pane2.scrollTop - 8;
  els.pane2.scrollTo({ top, behavior: 'smooth' });
  els.pane2.querySelectorAll('.c.flash').forEach((el) => el.classList.remove('flash'));
  target.classList.add('flash');
  setTimeout(() => target.classList.remove('flash'), 1500);
}

function highlight(verse) {
  els.pane1.querySelectorAll('.v.hl').forEach((el) => el.classList.remove('hl'));
  const el = els.pane1.querySelector(`.v[data-v="${verse}"]`);
  if (el) {
    el.classList.add('hl');
    // scroll only pane 1 (not the page), putting the verse about a third of the way down
    const top = el.getBoundingClientRect().top - els.pane1.getBoundingClientRect().top + els.pane1.scrollTop - els.pane1.clientHeight / 3;
    els.pane1.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

async function render() {
  const token = ++renderToken;
  syncControls();
  setMsg(els.pane1, 'Loading…');
  setMsg(els.pane2, 'Loading…');
  if (pane1Cleared) {
    els.pane1.replaceChildren();
  } else {
    try {
      const [data, summaries] = await Promise.all([
        loadBible(state.book, state.chapter),
        loadSummaries(state.book),
      ]);
      if (token !== renderToken) return;
      renderBible(data, summaries[state.chapter]);
    } catch (err) {
      if (token === renderToken) setMsg(els.pane1, err.message);
    }
  }
  if (pane2Cleared) {
    els.pane2.replaceChildren();
    // The text stays out of the DOM, but the marks stay on, so a verse number is
    // still a live handle back into the commentary.
    try {
      const json = await loadCommentary(state.source, state.book, state.chapter);
      if (token !== renderToken) return;
      markVerses(verseStarts(json));
    } catch (err) { /* no marks when the chapter will not load */ }
  } else if (state.pane2Mode === 'intro') {
    try {
      const [data, summaries] = await Promise.all([loadIntroData(), loadSummaries(state.book)]);
      if (token !== renderToken) return;
      renderIntro(data, summaries);
    } catch (err) {
      if (token === renderToken) setMsg(els.pane2, err.message);
    }
  } else {
    try {
      const json = await loadCommentary(state.source, state.book, state.chapter);
      if (token !== renderToken) return;
      renderCommentary(json);
    } catch (err) {
      if (token === renderToken) setMsg(els.pane2, err.message);
    }
  }
  if (token === renderToken && restoreScroll) {
    els.pane1.scrollTop = restoreScroll[0];
    els.pane2.scrollTop = restoreScroll[1];
    restoreScroll = null;
  }
  if (token === renderToken && pendingVerse) {
    const v = pendingVerse;
    pendingVerse = null;
    highlight(v);
    const owner = els.pane1.querySelector(`.v[data-v="${v}"]`)?.dataset.c;
    if (owner) jumpToCommentary(owner);
  }
  try { localStorage.setItem('sharedBible', JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

function syncControls() {
  els.book.value = state.book;
  els.source.value = state.source;
  els.sourceLabel.hidden = state.pane2Mode === 'intro';
  $('showIntro').setAttribute('aria-pressed', String(state.pane2Mode === 'intro'));
  $('showCommentary').setAttribute('aria-pressed', String(state.pane2Mode === 'commentary'));
  els.pane1.classList.toggle('intro-select', state.pane2Mode === 'intro');
  const count = CHAPTERS[state.book];
  if (els.chapter.options.length !== count) {
    els.chapter.replaceChildren(...Array.from({ length: count }, (_, i) => new Option(i + 1, i + 1)));
  }
  els.chapter.value = state.chapter;
}

function go(bookIdx, chapter, verse = null) {
  pendingVerse = verse;
  recent = [{ book: bookIdx, chapter }, ...recent.filter((r) => r.book !== bookIdx || r.chapter !== chapter)].slice(0, 8);
  try { localStorage.setItem('sharedBibleRecent', JSON.stringify(recent)); } catch (e) { /* storage unavailable */ }
  const crossedTestament = (bookIdx < OT_COUNT) !== (state.book < OT_COUNT);
  state.book = bookIdx;
  state.chapter = chapter;
  // a manual source choice sticks until we cross into the other testament
  if (!state.sourceIsManual || crossedTestament) {
    state.source = defaultSource(bookIdx);
    state.sourceIsManual = false;
  }
  render();
}

function step(delta) {
  let b = state.book, c = state.chapter + delta;
  if (c < 1) {
    if (b === 0) return;
    b -= 1; c = CHAPTERS[b];
  } else if (c > CHAPTERS[b]) {
    if (b === BOOKS.length - 1) return;
    b += 1; c = 1;
  }
  go(b, c);
}

// Remember how far down each pane was scrolled, and restore it on the next visit (same chapter only).
function initScrollMemory() {
  try {
    const saved = JSON.parse(localStorage.getItem('sharedBibleScroll') || 'null');
    if (saved && saved.book === state.book && saved.chapter === state.chapter) restoreScroll = [+saved.s1 || 0, +saved.s2 || 0];
  } catch (e) { /* ignore bad saved scroll */ }
  let timer = null;
  const save = () => {
    if (restoreScroll) return; // don't overwrite the saved spot before it has been restored
    clearTimeout(timer);
    timer = setTimeout(() => {
      try {
        localStorage.setItem('sharedBibleScroll', JSON.stringify({ book: state.book, chapter: state.chapter, s1: Math.round(els.pane1.scrollTop), s2: Math.round(els.pane2.scrollTop) }));
      } catch (e) { /* storage unavailable */ }
    }, 300);
  };
  els.pane1.addEventListener('scroll', save);
  els.pane2.addEventListener('scroll', save);
}

function openRef() {
  $('refErr').textContent = '';
  $('refInput').value = '';
  $('refRecent').replaceChildren(...recent.map((r) => {
    const b = document.createElement('button');
    b.textContent = `${BOOKS[r.book][1]} ${r.chapter}`;
    b.addEventListener('click', () => { closeRef(); go(r.book, r.chapter); });
    return b;
  }));
  $('refModal').hidden = false;
  $('refInput').focus();
}

function closeRef() { $('refModal').hidden = true; }

function submitRef() {
  const r = parseRef($('refInput').value, state.book);
  if (r.error) { $('refErr').textContent = r.error; return; }
  closeRef();
  go(r.book, r.chapter, r.verse);
}

function initRefModal() {
  try {
    const saved = JSON.parse(localStorage.getItem('sharedBibleRecent') || '[]');
    if (Array.isArray(saved)) recent = saved.filter((r) => BOOKS[r.book] && r.chapter >= 1 && r.chapter <= CHAPTERS[r.book]).slice(0, 8);
  } catch (e) { /* ignore bad saved recents */ }
  $('refBtn').addEventListener('click', openRef);
  $('refGo').addEventListener('click', submitRef);
  $('refCancel').addEventListener('click', closeRef);
  $('refModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeRef(); });
  $('refInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitRef();
    if (e.key === 'Escape') closeRef();
  });
}

function init() {
  els.book.replaceChildren(...BOOKS.map((b, i) => new Option(b[1], i)));
  els.source.replaceChildren(...Object.entries(SOURCES).map(([id, name]) => new Option(name, id)));

  try {
    const saved = JSON.parse(localStorage.getItem('sharedBible') || 'null');
    if (saved && BOOKS[saved.book] && SOURCES[saved.source] && saved.chapter >= 1 && saved.chapter <= CHAPTERS[saved.book]) {
      Object.assign(state, { book: saved.book, chapter: saved.chapter, source: saved.source, sourceIsManual: !!saved.sourceIsManual });
      if (saved.pane2Mode === 'intro') state.pane2Mode = 'intro';
    }
  } catch (e) { /* ignore bad saved state */ }

  els.book.addEventListener('change', () => go(+els.book.value, 1));
  els.chapter.addEventListener('change', () => go(state.book, +els.chapter.value));
  els.source.addEventListener('change', () => { state.source = els.source.value; state.sourceIsManual = true; render(); });
  $('showIntro').addEventListener('click', () => setPane2Mode('intro'));
  $('showCommentary').addEventListener('click', () => setPane2Mode('commentary'));
  els.pane1.addEventListener('click', (e) => {
    const num = e.target.closest('.v sup');
    // in poetry the number sits inside a .poem line, so go up to the verse span
    if (!num) return;
    const v = num.closest('.v');
    if (state.pane2Mode === 'intro' || pane2Cleared) {
      setPane2Mode('commentary', +v.dataset.v);
      return;
    }
    if (!v.dataset.c) return;
    jumpToCommentary(v.dataset.c);
  });
  document.querySelectorAll('.pgdn').forEach((btn) => btn.addEventListener('click', () => {
    const pane = $(btn.dataset.pane);
    pane.scrollBy({ top: pane.clientHeight - 48, behavior: 'smooth' });
  }));
  $('clr1').addEventListener('click', () => setPanesCleared(!pane1Cleared, pane2Cleared));
  $('clr2').addEventListener('click', () => setPanesCleared(pane1Cleared, !pane2Cleared));
  // right-click a pane to hide it, right-click the empty space to bring it back
  els.pane1.addEventListener('contextmenu', (e) => { e.preventDefault(); setPanesCleared(!pane1Cleared, pane2Cleared); });
  els.pane2.addEventListener('contextmenu', (e) => { e.preventDefault(); setPanesCleared(pane1Cleared, !pane2Cleared); });
  initScrollMemory();
  initRefModal();
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (!$('refModal').hidden) return;
    if (e.key === 'e' && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openRef(); return; }
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  render();
}

// Display prefs: font size applies to both panes via --fs; theme overrides the system setting once toggled.
const prefs = { fs: 17, theme: null };
const systemDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
const isDark = () => (prefs.theme ? prefs.theme === 'dark' : systemDark());

function applyPrefs() {
  document.documentElement.style.setProperty('--fs', `${prefs.fs}px`);
  if (prefs.theme) document.documentElement.setAttribute('data-theme', prefs.theme);
  $('theme').textContent = isDark() ? '\u2600 Light' : '\u263E Dark';
  try { localStorage.setItem('sharedBiblePrefs', JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ }
}

function initPrefs() {
  try {
    const saved = JSON.parse(localStorage.getItem('sharedBiblePrefs') || 'null');
    if (saved) {
      if (saved.fs >= 12 && saved.fs <= 32) prefs.fs = saved.fs;
      if (saved.theme === 'light' || saved.theme === 'dark') prefs.theme = saved.theme;
    }
  } catch (e) { /* ignore bad saved prefs */ }
  $('fontUp').addEventListener('click', () => { prefs.fs = Math.min(32, prefs.fs + 2); applyPrefs(); });
  $('fontDown').addEventListener('click', () => { prefs.fs = Math.max(12, prefs.fs - 2); applyPrefs(); });
  $('theme').addEventListener('click', () => { prefs.theme = isDark() ? 'light' : 'dark'; applyPrefs(); });
  applyPrefs();
}

initPrefs();
init();
</script>
</body>
</html>
